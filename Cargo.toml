[package]
name = "regolith-displayd"
version = "0.1.0"
edition = "2021"
# The oldest toolchain the package is built with (Ubuntu 22.04). Clippy
# only suggests what this version supports.
rust-version = "1.75"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
log = "0.4"
pretty_env_logger = "0.4.0"
tokio = { version = "1", features = ["full"]}
zbus = { version = "2", default-features = false, features = ["tokio"] }
serde = "1.0.139"
zvariant = "3.4.1"
swayipc-async = "2.0.0"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
lazy_static = "1.4.0"
num = "0.4.0"
num-derive = "0.4"
num-traits = "0.2.15"
trawlcat = "0.2.3"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
ab_glyph = "0.2"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
serde_json = "1"
