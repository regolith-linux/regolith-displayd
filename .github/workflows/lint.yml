name: Lint and Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-24.04
    # The Rust toolchain from the Ubuntu 26.04 archive: the same rustc,
    # clippy and rustfmt that build the 26.04 package, and stable for the
    # life of the release, so new lints don't appear without a change here.
    container: "ubuntu:26.04"
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the toolchain and build dependencies
        run: |
          apt-get install -y --no-install-recommends cargo rustc rustfmt rust-clippy
          apt-get build-dep -y ./

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
